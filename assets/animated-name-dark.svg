<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="105" viewBox="0 0 1000 105" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Yesith Hansana</title>
  <desc id="desc">Animated introduction with a waving hand and moving underline</desc>
  <defs>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2eedf"/>
      <stop offset=".48" stop-color="#f2eedf"/>
      <stop offset=".62" stop-color="#a7a48d"/>
      <stop offset=".76" stop-color="#f2eedf"/>
      <stop offset="1" stop-color="#f2eedf"/>
      <animate attributeName="x1" values="-1;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4.8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <text x="475" y="61" text-anchor="middle" fill="url(#text)" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="-.7">Hi, I'm Yesith Hansana</text>
  <g>
    <text x="792" y="62" text-anchor="middle" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif" font-size="38">👋</text>
    <animateTransform attributeName="transform" type="rotate" values="0 792 52;12 792 52;-8 792 52;12 792 52;-5 792 52;0 792 52;0 792 52" keyTimes="0;.1;.2;.3;.4;.5;1" dur="2.6s" repeatCount="indefinite"/>
  </g>
  <line x1="275" y1="86" x2="725" y2="86" stroke="#8c8c73" stroke-width="3" stroke-linecap="round">
    <animate attributeName="x2" values="275;725;725" keyTimes="0;.45;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <circle cx="735" cy="86" r="3" fill="#8c8c73"><animate attributeName="r" values="2;4;2" dur="1.6s" repeatCount="indefinite"/></circle>
</svg>
