    </linearGradient>
  </defs>
  <rect x="1" y="1" width="268" height="54" rx="14" fill="url(#surface)" stroke="#8c8c73" stroke-width="2"/>
  <circle cx="29" cy="28" r="14" fill="#2b2925"/>
