<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yesith Hansana — Full-Stack Developer</title>
  <desc id="desc">Animated editorial banner in the warm neutral color palette of hansana.dev.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1F0ED" />
      <stop offset="1" stop-color="#E8E8E3" />
    </linearGradient>
    <linearGradient id="olive" x1="800" y1="55" x2="1110" y2="305" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A29E9A" />
      <stop offset="1" stop-color="#8C8C73" />
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#D1D1C7" stroke-opacity="0.44" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#393632" flood-opacity="0.16" />
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#paper)" />
    <rect width="1200" height="360" fill="url(#grid)" />

    <circle cx="115" cy="62" r="72" fill="#D1D1C7" fill-opacity="0.38">
      <animate attributeName="r" values="64;78;64" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="310" r="92" fill="#BFBFB1" fill-opacity="0.22">
      <animate attributeName="cx" values="760;805;760" dur="9s" repeatCount="indefinite" />
    </circle>

    <g transform="translate(65 42)">
      <text x="0" y="0" dominant-baseline="hanging" fill="#6B645C" font-family="Courier New, monospace" font-size="14" font-weight="700" letter-spacing="2.6">PORTFOLIO / 2026</text>
      <circle cx="660" cy="8" r="5" fill="#8C8C73">
        <animate attributeName="opacity" values="1;0.28;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="674" y="0" dominant-baseline="hanging" fill="#524D47" font-family="Courier New, monospace" font-size="13" font-weight="700">AVAILABLE FOR COLLABORATION</text>
    </g>

    <g font-family="Arial Narrow, Segoe UI, Arial, sans-serif" fill="#171717" font-weight="750" letter-spacing="-4">
      <g>
        <text x="61" y="168" font-size="108">YESITH</text>
        <animateTransform attributeName="transform" type="translate" values="0 52;0 0" begin="0.15s" dur="0.65s" calcMode="spline" keySplines="0.2 0.8 0.2 1" fill="freeze" />
      </g>
      <g>
        <text x="61" y="267" font-size="108">HANSANA</text>
        <animateTransform attributeName="transform" type="translate" values="0 52;0 0" begin="0.32s" dur="0.68s" calcMode="spline" keySplines="0.2 0.8 0.2 1" fill="freeze" />
      </g>
    </g>

    <g transform="translate(65 305)">
      <rect width="616" height="2" rx="1" fill="#BFBFB1" />
      <rect width="130" height="2" rx="1" fill="#393632">
        <animate attributeName="x" values="0;486;0" dur="6s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite" />
      </rect>
      <text x="0" y="28" fill="#6B645C" font-family="Courier New, monospace" font-size="14" font-weight="700" letter-spacing="1.3">FULL-STACK DEVELOPER · SRI LANKA</text>
    </g>

    <g transform="translate(858 54)" filter="url(#shadow)">
      <rect width="278" height="252" rx="18" fill="#080807" />
      <rect x="1" y="1" width="276" height="250" rx="17" stroke="#393632" stroke-width="2" />
      <rect x="24" y="26" width="64" height="24" rx="12" fill="url(#olive)" />
      <text x="56" y="43" text-anchor="middle" fill="#F1F0ED" font-family="Courier New, monospace" font-size="10" font-weight="700">PROFILE</text>
      <text x="235" y="43" text-anchor="middle" fill="#7E766C" font-family="Courier New, monospace" font-size="13">01</text>

      <text x="24" y="94" fill="#F1F0ED" font-family="Arial Narrow, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">BUILD</text>
      <text x="24" y="130" fill="#D1D1C7" font-family="Arial Narrow, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">SHIP</text>
      <text x="24" y="166" fill="#8C8C73" font-family="Arial Narrow, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">REFINE</text>

      <path d="M24 190H254" stroke="#393632" />
      <text x="24" y="219" fill="#BFBFB1" font-family="Courier New, monospace" font-size="12">WEB · BACKEND · CLOUD · AI</text>
      <rect x="24" y="230" width="7" height="7" rx="3.5" fill="#8C8C73">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite" />
      </rect>
      <rect x="38" y="232" width="90" height="3" rx="1.5" fill="#524D47" />
    </g>

    <rect x="1" y="1" width="1198" height="358" rx="23" stroke="#BFBFB1" stroke-width="2" />
  </g>
</svg>
