<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yesith Sri Hansana — Software Engineer</title>
  <desc id="desc">Animated purple and blue developer profile banner with a terminal window.</desc>

  <defs>
    <linearGradient id="background" x1="50" y1="10" x2="1130" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B18" />
      <stop offset="0.48" stop-color="#15112E" />
      <stop offset="1" stop-color="#071C2B" />
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="70" x2="820" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" />
      <stop offset="0.5" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="terminal" x1="850" y1="65" x2="1090" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20233C" stop-opacity="0.96" />
      <stop offset="1" stop-color="#111425" stop-opacity="0.94" />
    </linearGradient>
    <radialGradient id="glowPurple">
      <stop stop-color="#8B5CF6" stop-opacity="0.45" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue">
      <stop stop-color="#0EA5E9" stop-opacity="0.38" />
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.38" />
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="26" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)" />
    <path d="M0 284C213 197 354 355 596 277C811 208 1008 238 1200 144V360H0V284Z" fill="#111B33" fill-opacity="0.72" />
    <path d="M0 304C224 229 383 370 610 302C843 232 1051 278 1200 207" stroke="url(#accent)" stroke-opacity="0.2" stroke-width="2" />

    <circle cx="160" cy="58" r="180" fill="url(#glowPurple)" filter="url(#blur)">
      <animate attributeName="cx" values="160;245;160" dur="9s" repeatCount="indefinite" />
      <animate attributeName="cy" values="58;100;58" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="290" r="205" fill="url(#glowBlue)" filter="url(#blur)">
      <animate attributeName="cx" values="1020;940;1020" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="290;225;290" dur="8s" repeatCount="indefinite" />
    </circle>

    <g opacity="0.24">
      <circle cx="60" cy="74" r="3" fill="#C4B5FD"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" /></circle>
      <circle cx="706" cy="67" r="2.5" fill="#7DD3FC"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite" /></circle>
      <circle cx="1125" cy="86" r="3" fill="#5EEAD4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite" /></circle>
      <circle cx="755" cy="320" r="2" fill="#C4B5FD"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite" /></circle>
    </g>

    <g transform="translate(82 77)">
      <rect x="0" y="2" width="7" height="205" rx="3.5" fill="url(#accent)" />
      <rect x="0" y="2" width="7" height="52" rx="3.5" fill="#FFFFFF">
        <animate attributeName="y" values="2;155;2" dur="4.8s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite" />
      </rect>

      <text x="32" y="34" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3">HELLO, WORLD — I'M</text>
      <text x="29" y="105" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">YESITH SRI</text>
      <text x="31" y="151" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="650">Software Engineer · Full-Stack Builder</text>
      <text x="31" y="193" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Designing clean experiences. Engineering reliable systems.</text>

      <g transform="translate(31 220)">
        <rect width="178" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.55" />
        <circle cx="21" cy="19" r="5" fill="#4ADE80"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" /></circle>
        <text x="36" y="25" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">OPEN TO COLLABS</text>
      </g>
    </g>

    <g transform="translate(844 62)" filter="url(#shadow)">
      <rect width="292" height="238" rx="18" fill="url(#terminal)" stroke="#64748B" stroke-opacity="0.35" />
      <path d="M0 47H292" stroke="#64748B" stroke-opacity="0.28" />
      <circle cx="23" cy="24" r="5" fill="#FB7185" />
      <circle cx="42" cy="24" r="5" fill="#FBBF24" />
      <circle cx="61" cy="24" r="5" fill="#4ADE80" />
      <text x="146" y="29" text-anchor="middle" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">yesith@dev: ~</text>

      <text x="22" y="78" fill="#38BDF8" font-family="Consolas, monospace" font-size="13">$</text>
      <text x="39" y="78" fill="#E2E8F0" font-family="Consolas, monospace" font-size="13">whoami</text>
      <text x="22" y="105" fill="#A78BFA" font-family="Consolas, monospace" font-size="13">software_engineer</text>

      <text x="22" y="140" fill="#38BDF8" font-family="Consolas, monospace" font-size="13">$</text>
      <text x="39" y="140" fill="#E2E8F0" font-family="Consolas, monospace" font-size="13">current_focus</text>
      <text x="22" y="167" fill="#5EEAD4" font-family="Consolas, monospace" font-size="13">[web, backend, cloud, ai]</text>

      <text x="22" y="202" fill="#38BDF8" font-family="Consolas, monospace" font-size="13">$</text>
      <rect x="39" y="190" width="8" height="16" rx="1" fill="#E2E8F0"><animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite" /></rect>
    </g>

    <rect x="1" y="1" width="1198" height="358" rx="25" stroke="url(#accent)" stroke-opacity="0.36" stroke-width="2" />
  </g>
</svg>
